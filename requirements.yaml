# Requirements for the demo shop (Maktabti). The QA reviewer checks each release against them.
# Each requirement lists the QA checks (see qa_checks/) that cover it. The status is computed by code from the real check results:
#   all its checks passed -> met; any failed -> failed; no checks listed -> uncovered (a coverage gap, shown as such).
# These are sample requirements for the demo: replace them with the real requirements document.
requirements:
- id: R-01
  ar: ما أحد يدخل إلا بتسجيل دخول صحيح
  en: Nobody gets in without a correct sign-in
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - cart_requires_login
  - wrong_password_is_rejected
- id: R-02
  ar: البحث ما يسمح لأحد يخرّب قاعدة البيانات
  en: Search cannot be used to break the database
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - search_resists_sql_injection
- id: R-03
  ar: رسائل الخطأ ما تكشف أسرار النظام
  en: Error messages do not reveal system secrets
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - errors_do_not_leak_internals
- id: R-04
  ar: المتصفح يستلم إعدادات الحماية
  en: The browser receives protection settings
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - security_headers_are_set
- id: R-05
  ar: الموقع يشتغل بقفل الحماية HTTPS
  en: The site runs with the HTTPS lock
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - connection_uses_https
- id: R-06
  ar: بيانات المستخدمين محفوظة بأمان
  en: User data is kept safe
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - passwords_are_stored_hashed
  - card_data_is_not_stored
  - other_users_orders_are_not_visible
- id: R-07
  ar: ما أحد يقدر يخمّن كلمة المرور
  en: Nobody can guess a password
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - account_locks_after_failed_logins
  - failed_logins_are_logged
- id: R-08
  ar: الجلسة تنتهي إذا المستخدم تركها
  en: The session ends when the user leaves it
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - session_expires_after_inactivity
- id: R-09
  ar: الموقع محمي من الهجمات الشائعة
  en: The site is protected from common attacks
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - search_output_is_escaped
  - forms_have_csrf_protection
  - upload_accepts_images_only
- id: R-10
  ar: السلة والبحث يشتغلون صح
  en: The cart and search work correctly
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - cart_add_and_quantity_work
  - search_finds_books_by_title_and_author
- id: R-11
  ar: يطلع تأكيد بعد الشراء
  en: A confirmation appears after buying
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - order_confirmation_appears_after_checkout
- id: R-12
  ar: الموقع بالعربي والإنجليزي وسريع
  en: The site is in Arabic and English, and fast
  source: متطلبات العرض التجريبي · Demo requirements
  checks:
  - pages_available_in_arabic_and_english
  - home_page_loads_fast
