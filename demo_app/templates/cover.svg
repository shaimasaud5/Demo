<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" role="img" aria-label="{{ lines|join(' ') }}">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{ dark }}"/>
      <stop offset="1" stop-color="{{ light }}"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="440" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2">
  {% if pattern == "circles" %}
    <circle cx="230" cy="90" r="120"/><circle cx="230" cy="90" r="80"/><circle cx="230" cy="90" r="40"/>
  {% elif pattern == "arches" %}
    <path d="M40 260v-80a110 110 0 0 1 220 0v80"/><path d="M80 260v-80a70 70 0 0 1 140 0v80"/><path d="M120 260v-80a30 30 0 0 1 60 0v80"/>
  {% elif pattern == "bars" %}
    <rect x="60" y="160" width="36" height="100"/><rect x="120" y="120" width="36" height="140"/><rect x="180" y="70" width="36" height="190"/>
  {% elif pattern == "grid" %}
    {% for x in range(40, 280, 40) %}{% for y in range(40, 220, 40) %}<circle cx="{{ x }}" cy="{{ y }}" r="3" fill="#fff" fill-opacity=".35" stroke="none"/>{% endfor %}{% endfor %}
    <path d="M40 200L120 120L200 160L260 60"/>
  {% else %}
    <ellipse cx="150" cy="150" rx="120" ry="45" transform="rotate(-20 150 150)"/><ellipse cx="150" cy="150" rx="80" ry="28" transform="rotate(25 150 150)"/><circle cx="150" cy="150" r="18" fill="#fff" fill-opacity=".4" stroke="none"/>
  {% endif %}
  </g>
  <rect width="22" height="440" fill="url(#shade)"/>
  <text x="150" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="11" letter-spacing="3" fill="#fff" fill-opacity=".75">{{ category|upper }}</text>
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700" fill="#fff" text-anchor="middle">
    {% for line in lines %}<text x="150" y="{{ 290 + loop.index0 * (size + 6) }}" font-size="{{ size }}">{{ line }}</text>{% endfor %}
  </g>
  <rect x="120" y="395" width="60" height="2" fill="#fff" fill-opacity=".6"/>
  <text x="150" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#fff" fill-opacity=".9">{{ author }}</text>
</svg>
