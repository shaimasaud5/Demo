# Yaqidh: tests and scans this pull request's code in CI and sends the results to Yaqidh.
#   qa       runs the PR's app and the Playwright security checks
#   security runs Semgrep (code) and Trivy (libraries)
# Repository secrets needed: YAQIDH_URL (the public https address of the Yaqidh API) and YAQIDH_TOKEN (its API_TOKEN).
name: yaqidh

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this pull request's code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR's own commit, not the merge commit

      - name: Check out the Yaqidh scanner
        uses: actions/checkout@v4
        with:
          repository: enghanamansour/YAQIDH
          ref: shaima
          path: yaqidh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the tools
        run: |
          python -m pip install --upgrade pip
          pip install -e yaqidh
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          (cd yaqidh && ./scripts/fetch_semgrep_rules.sh)
          trivy fs --download-db-only

      - name: Scan the code and send the results
        env:
          YAQIDH_URL: ${{ secrets.YAQIDH_URL }}
          YAQIDH_TOKEN: ${{ secrets.YAQIDH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python yaqidh/scripts/ci_scan.py --stage security --target demo_app --rules yaqidh/config/semgrep-rules --out yaqidh-security.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaqidh-security
          path: yaqidh-security.json

  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this pull request's code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the Yaqidh scanner
        uses: actions/checkout@v4
        with:
          repository: enghanamansour/YAQIDH
          ref: shaima
          path: yaqidh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the tools and the app's own requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e yaqidh
          pip install flask          # current Flask: the app's pinned old versions do not run on this Python
          playwright install --with-deps chromium

      - name: Test the app and send the results
        env:
          YAQIDH_URL: ${{ secrets.YAQIDH_URL }}
          YAQIDH_TOKEN: ${{ secrets.YAQIDH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python yaqidh/scripts/ci_scan.py --stage qa --app-dir . --out yaqidh-qa.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaqidh-qa
          path: yaqidh-qa.json
